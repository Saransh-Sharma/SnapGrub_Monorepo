name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contracts-and-backend:
    runs-on: ubuntu-latest
    env:
      CORS_ALLOW_ORIGIN: http://localhost:3000
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:contracts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run backend:typecheck
      - run: npm run backend:lint:migrations
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          printf 'CORS_ALLOW_ORIGIN=%s\n' "$CORS_ALLOW_ORIGIN" > services/backend/supabase/functions/.env
          printf 'AI_PROVIDER=%s\n' "$AI_PROVIDER" >> services/backend/supabase/functions/.env
      - working-directory: services/backend/supabase
        run: supabase start && supabase db reset
      - working-directory: services/backend/supabase
        run: supabase status -o env >> "$GITHUB_ENV"
      - run: npm run backend:test:auth-profile
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:photo-analysis
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:rls
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:meal-core
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:multimodal
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:offline-sync
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:insights
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:privacy
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:remediation
        env:
          NODE_OPTIONS: --experimental-websocket
      - run: npm run backend:test:remediation-unit

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/clean-flutter-ephemeral.sh
      - run: bash scripts/bootstrap-mobile-platforms.sh
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code -- apps/mobile/android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java apps/mobile/ios/Runner/GeneratedPluginRegistrant.*
      - working-directory: apps/mobile
        run: dart format --set-exit-if-changed lib test integration_test
      - run: bash scripts/clean-flutter-ephemeral.sh
      - working-directory: apps/mobile
        run: flutter analyze
      - run: bash scripts/clean-flutter-ephemeral.sh
      - working-directory: apps/mobile
        run: flutter test
      - working-directory: apps/mobile
        run: flutter build apk --debug --flavor dev --dart-define=SNAPGRUB_ENV=dev
