appId: ${APP_ID}
name: 01_conversational_critical_smoke
tags:
  - e2e
  - critical
  - conversational
---
- clearKeychain
- clearState
- launchApp
- runFlow: ../common/auth_onboarding.yaml
- assertVisible:
    id: "screen.day_thread"
- tapOn:
    id: "conversation.composer"
- inputText: "${E2E_TEXT_MEAL_INPUT}"
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    id: "conversation.send_or_voice"
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "conversation.proposal.confirm"
    timeout: 15000
- tapOn:
    id: "conversation.proposal.confirm"
- waitForAnimationToEnd
- tapOn:
    id: "tab.atlas"
- extendedWaitUntil:
    visible:
      id: "screen.meal_atlas"
    timeout: 10000
- assertVisible:
    id: "atlas.content"
- tapOn:
    id: "tab.today"
- assertVisible:
    id: "screen.day_thread"
- tapOn:
    id: "conversation.previous_day"
- assertVisible:
    id: "conversation.date.yesterday"
- tapOn:
    id: "conversation.next_day"
- assertVisible:
    id: "conversation.date.today"
- tapOn:
    id: "conversation.add_menu"
- assertVisible:
    id: "conversation.capture.camera"
- assertVisible:
    id: "conversation.capture.scan"
- assertVisible:
    id: "conversation.capture.voice"
- assertVisible:
    id: "conversation.capture.manual"
- tapOn:
    id: "conversation.capture.manual"
- extendedWaitUntil:
    visible:
      id: "scaffold.meal_editor"
    timeout: 10000
- back
- assertVisible:
    id: "screen.day_thread"
- tapOn:
    id: "tab.you"
- extendedWaitUntil:
    visible:
      id: "scaffold.settings"
    timeout: 10000
- assertVisible:
    id: "settings.privacy"
- tapOn:
    id: "tab.today"
- assertVisible:
    id: "screen.day_thread"
- tapOn:
    id: "tab.capture"
- extendedWaitUntil:
    visible:
      id: "screen.capture"
    timeout: 10000
- back
- assertVisible:
    id: "screen.day_thread"
