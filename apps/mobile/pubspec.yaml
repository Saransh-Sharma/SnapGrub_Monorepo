name: snapgrub
description: Premium camera-first calorie tracking app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.1
  connectivity_plus: ^6.1.1
  camera: ^0.11.0+2
  mobile_scanner: ^7.2.0
  google_mlkit_text_recognition: ^0.15.1
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  image: ^4.3.0
  crypto: ^3.0.6
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.2
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  snapgrub_api_contracts:
    path: ../../packages/api-contracts/generated/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
