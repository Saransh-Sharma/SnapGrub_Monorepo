openapi: 3.1.0
info:
  title: SnapGrub API
  version: 0.3.0
  description: Phase 0-8 contracts for auth bootstrap, settings, meal core, multimodal entry, offline sync, privacy export, and account deletion.
  license:
    name: Proprietary
    url: https://snapgrub.app/legal
servers:
  - url: https://{projectRef}.supabase.co/functions/v1
    variables:
      projectRef:
        default: snapgrub-dev
security:
  - bearerAuth: []
paths:
  /profile-bootstrap:
    post:
      operationId: profileBootstrap
      summary: Bootstrap authenticated profile state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileBootstrapRequest"
      responses:
        "200":
          description: Bootstrap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileBootstrapResponse"
        "401":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
  /settings-patch:
    patch:
      operationId: settingsPatch
      summary: Patch profile, active goal, and optional body measurement
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatchRequest"
      responses:
        "200":
          description: Updated profile state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPatchResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /events-ingest:
    post:
      operationId: eventsIngest
      summary: Ingest batched analytics events
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsIngestRequest"
      responses:
        "200":
          description: Accepted event count
          content:
            application/json:
              schema:
                type: object
                required: [accepted, request_id]
                properties:
                  accepted:
                    type: integer
                  request_id:
                    $ref: "#/components/schemas/RequestId"
        "400":
          $ref: "#/components/responses/Error"
  /custom-foods:
    post:
      operationId: customFoodsUpsert
      summary: Idempotently upsert or tombstone a custom food
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFoodMutationRequest"
      responses:
        "200":
          description: Authoritative custom food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFoodMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /meal-templates:
    post:
      operationId: mealTemplatesUpsert
      summary: Idempotently upsert or tombstone a meal template
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealTemplateMutationRequest"
      responses:
        "200":
          description: Authoritative meal template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealTemplateMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /body-measurements:
    post:
      operationId: bodyMeasurementCreate
      summary: Idempotently create a body measurement
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyMeasurementCreateRequest"
      responses:
        "200":
          description: Authoritative body measurement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyMeasurementCreateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /exports-create:
    post:
      operationId: exportCreate
      summary: Idempotently create a user data export artifact
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreateRequest"
      responses:
        "202":
          description: Export request accepted and artifact generated when possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportCreateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /exports-create/{export_request_id}:
    get:
      operationId: exportGet
      summary: Poll an export request and refresh its signed download URL
      parameters:
        - name: export_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export request state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportCreateResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /account-delete:
    post:
      operationId: accountDelete
      summary: Delete the authenticated user's account and user-owned data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeleteRequest"
      responses:
        "200":
          description: Account deletion completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeleteResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /media-retention-cleanup:
    post:
      operationId: mediaRetentionCleanup
      summary: Service-role cleanup for expired exports and retained meal media
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 5000
      responses:
        "200":
          description: Cleanup counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Error"
  /weekly-insights-generate:
    post:
      operationId: weeklyInsightsGenerate
      summary: Generate weekly insight snapshots for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyInsightsGenerateRequest"
      responses:
        "200":
          description: Generated weekly insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyInsightsGenerateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /meals:
    get:
      operationId: listMeals
      summary: List authenticated user's meals
      parameters:
        - name: day
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Meal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealListResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createMeal
      summary: Create a meal and replace its item set transactionally
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealWriteRequest"
      responses:
        "200":
          description: Authoritative meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWriteResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /meals/{meal_id}:
    get:
      operationId: getMeal
      summary: Get one authenticated user's meal
      parameters:
        - name: meal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Meal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWriteResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMeal
      summary: Update a meal and replace its item set transactionally
      parameters:
        - name: meal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealWriteRequest"
      responses:
        "200":
          description: Authoritative meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWriteResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMeal
      summary: Soft-delete a meal
      parameters:
        - name: meal_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id]
              properties:
                client_request_id:
                  $ref: "#/components/schemas/ClientRequestId"
                expected_revision:
                  type: integer
      responses:
        "200":
          description: Deleted meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWriteResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /analysis-photo-create:
    post:
      operationId: analysisPhotoCreate
      summary: Analyze a user-owned meal photo and return an editable meal draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoAnalysisCreateRequest"
      responses:
        "200":
          description: Photo analysis job and editable result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /analysis-get/{analysis_id}:
    get:
      operationId: analysisGet
      summary: Get one authenticated user's photo analysis job
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Photo analysis job and latest result when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAnalysisResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /foods-search:
    post:
      operationId: foodsSearch
      summary: Search canonical, branded, custom, and recent food sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodSearchRequest"
      responses:
        "200":
          description: Food search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodsSearchResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /barcode-resolve:
    post:
      operationId: barcodeResolve
      summary: Resolve a product barcode into an editable draft or fallback state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeResolveRequest"
      responses:
        "200":
          description: Barcode resolution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeResolveResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /analysis-text-create:
    post:
      operationId: analysisTextCreate
      summary: Parse typed meal text into an editable meal draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextAnalysisCreateRequest"
      responses:
        "200":
          description: Text analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultimodalAnalysisResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /analysis-label-create:
    post:
      operationId: analysisLabelCreate
      summary: Parse nutrition-label OCR text into an editable packaged-food draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelAnalysisCreateRequest"
      responses:
        "200":
          description: Label analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultimodalAnalysisResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /analysis-voice-create:
    post:
      operationId: analysisVoiceCreate
      summary: Parse an edited voice transcript into an editable meal draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceAnalysisCreateRequest"
      responses:
        "200":
          description: Voice transcript analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultimodalAnalysisResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RequestId:
      type: string
      format: uuid
    ClientRequestId:
      type: string
      format: uuid
    ErrorEnvelope:
      type: object
      required: [code, message, user_message, retryable, request_id, details]
      properties:
        code:
          type: string
          enum: [AUTH_REQUIRED, INVALID_INPUT, NOT_FOUND, IDEMPOTENCY_CONFLICT, CONFLICT, UNKNOWN]
        message:
          type: string
        user_message:
          type: string
        retryable:
          type: boolean
        request_id:
          $ref: "#/components/schemas/RequestId"
        details:
          type: object
          additionalProperties: true
    UnitSystem:
      type: string
      enum: [metric, imperial]
    GoalType:
      type: string
      enum: [lose, maintain, gain, custom]
    Profile:
      type: object
      required:
        - id
        - locale
        - timezone
        - unit_system
        - cuisine_preferences
        - cloud_media_storage
        - save_original_photos
        - ai_improvement_consent
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        avatar_path:
          type: [string, "null"]
        locale:
          type: string
        timezone:
          type: string
        unit_system:
          $ref: "#/components/schemas/UnitSystem"
        country_code:
          type: [string, "null"]
        cuisine_preferences:
          type: array
          items:
            type: string
        cloud_media_storage:
          type: boolean
        save_original_photos:
          type: boolean
        ai_improvement_consent:
          type: boolean
        onboarding_completed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NutritionGoal:
      type: object
      required:
        - id
        - user_id
        - goal_type
        - calories_kcal
        - protein_g
        - carbs_g
        - fat_g
        - starts_on
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        goal_type:
          $ref: "#/components/schemas/GoalType"
        calories_kcal:
          type: number
        protein_g:
          type: number
        carbs_g:
          type: number
        fat_g:
          type: number
        fiber_g:
          type: [number, "null"]
        starts_on:
          type: string
          format: date
        ends_on:
          type: [string, "null"]
          format: date
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Device:
      type: object
      required: [id, user_id, install_id, platform, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        install_id:
          type: string
        platform:
          type: string
          enum: [ios, android]
        app_version:
          type: [string, "null"]
        build_number:
          type: [string, "null"]
        last_seen_at:
          type: string
          format: date-time
    FeatureFlags:
      type: object
      additionalProperties:
        oneOf:
          - type: boolean
          - type: string
          - type: number
          - type: object
          - type: array
    ProfileBootstrapRequest:
      type: object
      required: [install_id, platform, timezone]
      properties:
        install_id:
          type: string
        platform:
          type: string
          enum: [ios, android]
        app_version:
          type: [string, "null"]
        build_number:
          type: [string, "null"]
        locale:
          type: string
          default: en-US
        timezone:
          type: string
    ProfileBootstrapResponse:
      type: object
      required: [profile, active_goal, device, feature_flags, server_time, request_id]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        active_goal:
          anyOf:
            - $ref: "#/components/schemas/NutritionGoal"
            - type: "null"
        device:
          $ref: "#/components/schemas/Device"
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        server_time:
          type: string
          format: date-time
        request_id:
          $ref: "#/components/schemas/RequestId"
    ProfilePatch:
      type: object
      properties:
        display_name:
          type: [string, "null"]
        locale:
          type: string
        timezone:
          type: string
        unit_system:
          $ref: "#/components/schemas/UnitSystem"
        country_code:
          type: [string, "null"]
        cuisine_preferences:
          type: array
          items:
            type: string
        cloud_media_storage:
          type: boolean
        save_original_photos:
          type: boolean
        ai_improvement_consent:
          type: boolean
        onboarding_completed_at:
          type: [string, "null"]
          format: date-time
    ActiveGoalPatch:
      type: object
      required: [goal_type, calories_kcal, protein_g, carbs_g, fat_g]
      properties:
        goal_type:
          $ref: "#/components/schemas/GoalType"
        calories_kcal:
          type: number
          minimum: 500
          maximum: 6000
        protein_g:
          type: number
          minimum: 0
          maximum: 500
        carbs_g:
          type: number
          minimum: 0
          maximum: 800
        fat_g:
          type: number
          minimum: 0
          maximum: 400
        fiber_g:
          type: [number, "null"]
          minimum: 0
          maximum: 200
        starts_on:
          type: string
          format: date
        ends_on:
          type: [string, "null"]
          format: date
    BodyMeasurementPatch:
      type: object
      properties:
        measured_at:
          type: string
          format: date-time
        weight_kg:
          type: [number, "null"]
          minimum: 20
          maximum: 400
        body_fat_pct:
          type: [number, "null"]
          minimum: 2
          maximum: 80
        source:
          type: string
          enum: [manual, onboarding, imported]
    SettingsPatchRequest:
      type: object
      required: [client_request_id]
      properties:
        client_request_id:
          $ref: "#/components/schemas/ClientRequestId"
        profile_patch:
          $ref: "#/components/schemas/ProfilePatch"
        active_goal_patch:
          $ref: "#/components/schemas/ActiveGoalPatch"
        body_measurement:
          anyOf:
            - $ref: "#/components/schemas/BodyMeasurementPatch"
            - type: "null"
    SettingsPatchResponse:
      type: object
      required: [profile, active_goal, server_time, request_id]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        active_goal:
          anyOf:
            - $ref: "#/components/schemas/NutritionGoal"
            - type: "null"
        body_measurement:
          type: [object, "null"]
        server_time:
          type: string
          format: date-time
        request_id:
          $ref: "#/components/schemas/RequestId"
    AnalyticsEvent:
      type: object
      required: [event_name, occurred_at]
      properties:
        event_name:
          type: string
        device_id:
          type: [string, "null"]
          format: uuid
        properties:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
    EventsIngestRequest:
      type: object
      required: [events]
      properties:
        client_request_id:
          $ref: "#/components/schemas/ClientRequestId"
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/AnalyticsEvent"
    CustomFood:
      type: object
      required: [id, user_id, client_id, name, calories_kcal, protein_g, carbs_g, fat_g, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        client_id:
          type: string
        name:
          type: string
        brand:
          type: [string, "null"]
        serving_quantity:
          type: [number, "null"]
        serving_unit:
          type: [string, "null"]
        serving_grams:
          type: [number, "null"]
        calories_kcal:
          type: number
        protein_g:
          type: number
        carbs_g:
          type: number
        fat_g:
          type: number
        deleted_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomFoodMutationRequest:
      type: object
      required: [client_request_id, client_id]
      properties:
        client_request_id:
          $ref: "#/components/schemas/ClientRequestId"
        id:
          type: [string, "null"]
          format: uuid
        client_id:
          type: string
        name:
          type: string
        brand:
          type: [string, "null"]
        serving_quantity:
          type: [number, "null"]
        serving_unit:
          type: [string, "null"]
        serving_grams:
          type: [number, "null"]
        calories_kcal:
          type: number
          minimum: 0
        protein_g:
          type: number
          minimum: 0
        carbs_g:
          type: number
          minimum: 0
        fat_g:
          type: number
          minimum: 0
        deleted_at:
          type: [string, "null"]
          format: date-time
    CustomFoodMutationResponse:
      type: object
