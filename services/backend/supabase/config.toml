project_id = "snapgrub-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "snapgrub://auth"
additional_redirect_urls = ["http://localhost:3000", "snapgrub://auth"]
jwt_expiry = 3600
enable_signup = true

[functions.profile-bootstrap]
verify_jwt = false

[functions.settings-patch]
verify_jwt = false

[functions.events-ingest]
verify_jwt = false
